<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>studyground</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,500;8..60,600;8..60,700&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/style.css" />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css"
      crossorigin="anonymous"
    />
  </head>
  <body>
    <div class="app">
      <aside id="sidebar">
        <div class="sidebar-brand">studyground</div>
        <div class="sidebar-section">
          <div class="sidebar-section-label" id="track-label">no track yet</div>
          <ul class="sidebar-lessons" id="sidebar-lessons"></ul>
        </div>
        <div class="sidebar-section">
          <div class="sidebar-section-label">outline</div>
          <ul class="sidebar-outline" id="sidebar-outline">
            <li class="hint">pick a lesson →</li>
          </ul>
        </div>
      </aside>

      <div class="content">
        <header>
          <h1 id="lesson-title-bar"></h1>
          <div class="actions">
            <button id="btn-recap" title="Fold answered Q&A in this lesson">Recap</button>
            <button id="btn-next">Next →</button>
          </div>
        </header>
        <main id="lesson-view">
          <p class="hint">Pick a lesson, or click <b>Next →</b> to generate one.</p>
        </main>
      </div>
    </div>

    <footer>
      <span id="status">idle</span>
    </footer>
    <script type="module" src="/main.js"></script>
  </body>
</html>
